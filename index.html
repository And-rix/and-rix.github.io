<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>:\> And-rix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* background-color: #0d1117; */
      background: linear-gradient(-45deg, #0d1117, #161b22, #0d1117, #1f2937);
      background-size: 400% 400%;
      animation: gradientBG 90s ease infinite;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
    }

    header {
      padding: 6rem 1rem 0;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin: 0;
      color: #58a6ff;
      text-shadow: 0 0 8px #58a6ff44;
    }

    header p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 1rem auto;
      color: #8b949e;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1rem 3rem;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    nav li {
      width: 100%;
      max-width: 300px;
    }

    nav a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      background-color: #1e1e1e;
      color: #58a6ff;
      border: 1px solid #2e2e2e;
      padding: 0.6em 1.2em;
      border-radius: 5px;
      text-decoration: none;
      display: block;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 0 1px #2e2e2e;
    }

    nav a:hover,
    nav a:focus {
      background-color: #2a2a2a;
      border-color: #58a6ff;
      outline: none;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 3rem;
      }

      nav li {
        max-width: 90vw;
      }

      nav a {
        padding: 0.8em 1.2em;
        white-space: normal;
      }
    }

    footer {
      font-family: 'JetBrains Mono', monospace;
      background-color: #1e1e1e;
      color: #6e7681;
      padding: 1rem 0;
      font-size: 0.85rem;
      border-top: 1px solid #2e2e2e;
      box-shadow: inset 0 1px 0 0 #2e2e2e;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:visited {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to And-rix!</h1>
    <p>Explore my growing script collections below...</p>
  </header>

  <main>
    <nav>
      <ul>
        <li>
          <a href="https://github.com/And-rix/" target="_blank" rel="noopener noreferrer" aria-label="Github/And-rix">
            🚀 GitHub/And-rix
          </a>
        </li>
        <li>
          <a href="pve-scripts.html" rel="noopener noreferrer" aria-label="pve-scripts">
            📟 pve-scripts
          </a>
        </li>
        <li>
          <a href="shelly-scripts.html" target="_blank" rel="noopener noreferrer" aria-label="shelly-scripts">
            🔌 shelly-scripts
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <footer>
    &copy; 2025 <a href="https://github.com/And-rix/" target="_blank" rel="noopener noreferrer">And-rix</a>
  </footer>
</body>
</html>
