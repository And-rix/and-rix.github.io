<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>And-rix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #0d1117, #161b22, #0d1117, #1f2937);
      background-size: 400% 400%;
      animation: gradientBG 90s ease infinite;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    header {
      padding: 4rem 1rem 2rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin: 0;
      color: #58a6ff;
      text-shadow: 0 0 8px #58a6ff44;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 1rem auto;
      color: #8b949e;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5rem;
      padding: 0 1rem 3rem;
    }

    main a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      background-color: #1e1e1e;
      color: #58a6ff;
      border: 1px solid #2e2e2e;
      padding: 0.6em 1.2em;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      max-width: 300px;
      margin: 0 auto;
      white-space: nowrap;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 0 1px #2e2e2e;
    }

    main a:hover,
    main a:focus {
      background-color: #2a2a2a;
      border-color: #58a6ff;
      outline: none;
    }

    @media (max-width: 600px) {
      main a {
        max-width: 90vw;
        white-space: normal;
        padding: 0.8em 1.2em;
      }
    }

    footer {
      font-family: 'JetBrains Mono', monospace;
      background-color: #1e1e1e;
      color: #6e7681;
      padding: 1rem 0;
      font-size: 0.85rem;
      border-top: 1px solid #2e2e2e;
      box-shadow: inset 0 1px 0 0 #2e2e2e;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:visited {
      color: #58a6ff;
    }  
    </style>
</head>
<body>
  <header>
    <h1>Welcome to And-rix!</h1>
    <p>Explore my growing script collections below...</p>
  </header>

  <main>
    <a href="https://github.com/And-rix/" target="_blank" rel="noopener noreferrer" aria-label="Github/And-rix">
      🚀 GitHub/And-rix
    </a>  
    <a href="https://github.com/And-rix/pve-scripts" target="_blank" rel="noopener noreferrer" aria-label="pve-scripts">
      📟 pve-scripts
    </a>
    <a href="https://github.com/And-rix/shelly-scripts" target="_blank" rel="noopener noreferrer" aria-label="shelly-scripts">
      🔌 shelly-scripts
    </a>
  </main>

  <footer>
    &copy; 2025 <a href="https://github.com/And-rix/" target="_blank" rel="noopener noreferrer">And-rix — All rights reserved</a>
  </footer>
</body>
</html>
